# use './mvnw "-Dspring.profiles.active=ci" test' to test with this profile
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Security Configuration
security.jwt.secret="this-is-a-512-bit-key-used-for-signing-jwt-tokens-that-should-be-changed-production"
security.jwt.expiration-in-ms=864000000

# Don't send mails by default in test
mail.grant-id = null
mail.authorization = null
mail.sendMails = false